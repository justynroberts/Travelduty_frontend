# Near-real-time: scrape and evaluate every 5s, so an outage pages within ~30s.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Each target carries an explicit `service` label: the Python services don't put one on their
  # metrics. A scraped `service` label is kept as `exported_service` (honor_labels: false).
  - job_name: travelduty
    static_configs:
      - { targets: [gateway:8080], labels: { service: gateway } }
      - { targets: [destination-service:8081], labels: { service: destination-service } }
      - { targets: [flight-service:8082], labels: { service: flight-service } }
      - { targets: [hotel-service:8083], labels: { service: hotel-service } }
      - { targets: [pricing-service:8084], labels: { service: pricing-service } }
      - { targets: [booking-service:8085], labels: { service: booking-service } }
      - { targets: [payment-service:8086], labels: { service: payment-service } }
      - { targets: [notification-service:8087], labels: { service: notification-service } }

  # Synthetic users. Kept out of the `travelduty` job so the per-service alerts only see real services.
  - job_name: synthetics
    static_configs:
      - { targets: [synthetics:8088], labels: { service: synthetics } }

  - job_name: prometheus
    static_configs:
      - { targets: [localhost:9090], labels: { service: prometheus } }

  - job_name: alertmanager
    static_configs:
      - { targets: [alertmanager:9093], labels: { service: alertmanager } }
