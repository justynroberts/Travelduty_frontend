# Alert rules for every TravelDuty service. Windows are short (30s) and `for` durations small
# because these alerts drive near-real-time incident demos. Probe routes are excluded so health
# checks and scrapes don't dilute the error ratio. Synthetics keeps traffic flowing so the ratios
# always have data; `keep_firing_for` stops a brief lull from resolving an incident that's still real.
groups:
  - name: travelduty
    rules:
      - alert: TravelDutyServiceDown
        expr: up{job="travelduty"} == 0
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: "Service is down"
          description: "Prometheus cannot scrape {{ $labels.service }} at {{ $labels.instance }}. The container is stopped, crashing or not answering /metrics."
          value: "unreachable"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md

      - alert: TravelDutyHighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{job="travelduty", status=~"5..", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s]))
            / sum by (service) (rate(http_requests_total{job="travelduty", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s]))
            > 0.20
        for: 10s
        keep_firing_for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Failing {{ $value | humanizePercentage }} of requests"
          description: "More than 20% of {{ $labels.service }} requests returned 5xx over the last 30s."
          value: "{{ $value | humanizePercentage }} 5xx"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#break-it-chaos

      - alert: TravelDutyHighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{job="travelduty", status=~"5..", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s]))
            / sum by (service) (rate(http_requests_total{job="travelduty", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s]))
            > 0.05
        for: 15s
        keep_firing_for: 30s
        labels: { severity: warning }
        annotations:
          summary: "Failing {{ $value | humanizePercentage }} of requests"
          description: "More than 5% of {{ $labels.service }} requests returned 5xx over the last 30s."
          value: "{{ $value | humanizePercentage }} 5xx"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#break-it-chaos

      - alert: TravelDutyHighLatency
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{job="travelduty", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s])))
            > 3
        for: 15s
        keep_firing_for: 30s
        labels: { severity: critical }
        annotations:
          summary: "p95 latency is {{ $value | humanizeDuration }}"
          description: "95th percentile response time for {{ $labels.service }} has been above 3s for 15s."
          value: "p95 {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#break-it-chaos

      - alert: TravelDutyHighLatency
        expr: |
          histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{job="travelduty", route!~"/health|/ready|/metrics|.*/admin/.*"}[30s])))
            > 1
        for: 15s
        keep_firing_for: 30s
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is {{ $value | humanizeDuration }}"
          description: "95th percentile response time for {{ $labels.service }} has been above 1s for 15s."
          value: "p95 {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#break-it-chaos

  - name: synthetics
    rules:
      - alert: TravelDutySyntheticJourneyFailing
        expr: |
          sum by (journey) (rate(synthetic_journeys_total{outcome="failed"}[1m]))
            / sum by (journey) (rate(synthetic_journeys_total[1m]))
            > 0.5
        for: 20s
        keep_firing_for: 30s
        labels: { severity: critical, service: synthetics }
        annotations:
          summary: "Customers can't complete the {{ $labels.journey }} journey ({{ $value | humanizePercentage }} failing)"
          description: "More than half of synthetic {{ $labels.journey }} journeys failed over the last minute. Failing steps: see synthetic_journeys_total{journey=\"{{ $labels.journey }}\",outcome=\"failed\"} by step, or GET /status on synthetics."
          value: "{{ $value | humanizePercentage }} of {{ $labels.journey }} journeys failing"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#synthetics

      - alert: TravelDutySyntheticsDown
        expr: up{job="synthetics"} == 0 or sum(synthetic_users_active) == 0
        for: 1m
        labels: { severity: warning, service: synthetics }
        annotations:
          summary: "Synthetic traffic has stopped"
          description: "Synthetics is down or paused, so error-rate and latency alerts have no traffic to measure and may stay silent during an outage."
          value: "no synthetic users running"
          runbook_url: https://github.com/justynroberts/Travelduty_frontend/blob/master/app/README.md#synthetics

  - name: monitoring
    rules:
      - alert: TravelDutyAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Alertmanager is down"
          description: "Prometheus cannot reach Alertmanager, so no further TravelDuty alerts will page."
          value: "unreachable"
