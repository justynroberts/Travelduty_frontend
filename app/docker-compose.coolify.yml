# TravelDuty on Coolify (travelduty.apps.fintonlabs.com).
# Same stack as docker-compose.yml with no public host ports: Traefik routes the public domain to
# web:80, and nginx in web proxies /api to the gateway on the internal network. Prometheus and
# Alertmanager always run here and page PagerDuty.
# Set ADMIN_TOKEN (protects /admin/*, i.e. chaos) and PAGERDUTY_ROUTING_KEY in Coolify.
name: travelduty

x-service: &service
  restart: unless-stopped
  environment: &common-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    APP_VERSION: ${APP_VERSION:-compose}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}

services:
  gateway:
    <<: *service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    image: travelduty/gateway
    expose: ["8080"]
    environment:
      <<: *common-env
      DESTINATION_SERVICE_URL: http://destination-service:8081
      FLIGHT_SERVICE_URL: http://flight-service:8082
      HOTEL_SERVICE_URL: http://hotel-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      BOOKING_SERVICE_URL: http://booking-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      # Password sign-in for the Operations tab's chaos controls; set both in Coolify.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Traefik and nginx sit in front, so the client IP (for the sign-in rate limit) is two hops back.
      TRUST_PROXY_HOPS: 2
    depends_on: [destination-service, flight-service, hotel-service, pricing-service, booking-service, payment-service, notification-service]

  destination-service:
    <<: *service
    build: { context: ., dockerfile: services/destination-service/Dockerfile }
    image: travelduty/destination-service

  flight-service:
    <<: *service
    build: { context: ., dockerfile: services/flight-service/Dockerfile }
    image: travelduty/flight-service

  hotel-service:
    <<: *service
    build: { context: ., dockerfile: services/hotel-service/Dockerfile }
    image: travelduty/hotel-service

  pricing-service:
    <<: *service
    build: { context: ., dockerfile: services/pricing-service/Dockerfile }
    image: travelduty/pricing-service

  booking-service:
    <<: *service
    build: { context: ., dockerfile: services/booking-service/Dockerfile }
    image: travelduty/booking-service
    environment:
      <<: *common-env
      DATABASE_URL: postgres://travelduty:travelduty@postgres:5432/travelduty
      FLIGHT_SERVICE_URL: http://flight-service:8082
      HOTEL_SERVICE_URL: http://hotel-service:8083
      PRICING_SERVICE_URL: http://pricing-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    depends_on:
      postgres: { condition: service_healthy }

  payment-service:
    <<: *service
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    image: travelduty/payment-service

  notification-service:
    <<: *service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    image: travelduty/notification-service
    environment:
      <<: *common-env
      # Set to a Slack incoming webhook (or https://webhook.site/...) to deliver notifications for real.
      WEBHOOK_URL: ${WEBHOOK_URL:-}

  web:
    restart: unless-stopped
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: travelduty/web
    expose: ["80"]
    depends_on: [gateway]

  # TravelDuty Synthetics: simulated users browsing, searching and booking through the gateway
  # around the clock, so alerts always have traffic to measure.
  synthetics:
    <<: *service
    build: { context: ., dockerfile: services/synthetics/Dockerfile }
    image: travelduty/synthetics
    environment:
      <<: *common-env
      GATEWAY_URL: http://gateway:8080
      SYNTHETICS_USERS: ${SYNTHETICS_USERS:-3}
      SYNTHETICS_ENABLED: ${SYNTHETICS_ENABLED:-true}
    depends_on: [gateway]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: travelduty
      POSTGRES_PASSWORD: travelduty
      POSTGRES_DB: travelduty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelduty"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Monitoring. Bound to the server's loopback only, never public: reach them over an SSH tunnel,
  #   ssh -L 9090:127.0.0.1:19090 -L 9093:127.0.0.1:19093 <server>
  prometheus:
    restart: unless-stopped
    build: { context: ., dockerfile: ops/prometheus/Dockerfile }
    image: travelduty/prometheus
    ports: ["127.0.0.1:19090:9090"]
    volumes: [promdata:/prometheus]
    depends_on: [alertmanager]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  alertmanager:
    restart: unless-stopped
    build: { context: ., dockerfile: ops/alertmanager/Dockerfile }
    image: travelduty/alertmanager
    ports: ["127.0.0.1:19093:9093"]
    environment:
      # Events API v2 routing key, set in Coolify. Alertmanager refuses to start without it.
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
    volumes: [amdata:/alertmanager]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  promdata:
  amdata:
