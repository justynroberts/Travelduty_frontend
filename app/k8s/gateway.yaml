apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: travelduty }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: travelduty }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: gateway
          image: travelduty/gateway:latest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: DESTINATION_SERVICE_URL
              value: "http://destination-service:8081"
            - name: FLIGHT_SERVICE_URL
              value: "http://flight-service:8082"
            - name: HOTEL_SERVICE_URL
              value: "http://hotel-service:8083"
            - name: PRICING_SERVICE_URL
              value: "http://pricing-service:8084"
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8085"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8086"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:8087"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: travelduty-admin, key: token, optional: true }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app.kubernetes.io/part-of: travelduty }
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
