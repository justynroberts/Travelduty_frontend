[package]
name = "payment-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "TravelDuty payment-service: simulated card processor"
license = "MIT"
publish = false

[lib]
name = "payment_service"
path = "src/lib.rs"

[[bin]]
name = "payment-service"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = { version = "0.13.4", default-features = false }
uuid = { version = "1.11", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
