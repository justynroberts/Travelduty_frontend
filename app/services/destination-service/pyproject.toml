[project]
name = "travelduty-destination-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["travelduty-common", "uvicorn[standard]>=0.32,<1"]

[project.scripts]
destination-service = "destination_service.__main__:main"

[tool.uv.sources]
travelduty-common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destination_service"]
