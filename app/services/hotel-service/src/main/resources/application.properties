spring.application.name=hotel-service
spring.main.banner-mode=off
server.port=${PORT:8083}
server.shutdown=graceful

# Unknown routes raise NoHandlerFoundException so they get the standard error envelope.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false

spring.jackson.default-property-inclusion=non_null

# Actuator is on the classpath only for Micrometer auto-configuration.
management.endpoints.web.exposure.exclude=*
management.endpoints.enabled-by-default=false
management.metrics.tags.service=hotel-service

travelduty.version=${APP_VERSION:dev}
travelduty.reference-data-dir=${REFERENCE_DATA_DIR:../../data}
travelduty.hold-ttl-seconds=${HOLD_TTL_SECONDS:900}
travelduty.admin-token=${ADMIN_TOKEN:}
travelduty.chaos.latency-ms=${CHAOS_LATENCY_MS:0}
travelduty.chaos.jitter-ms=${CHAOS_JITTER_MS:0}
travelduty.chaos.error-rate=${CHAOS_ERROR_RATE:0}
travelduty.chaos.error-status=${CHAOS_ERROR_STATUS:503}
travelduty.cleardown.retention-minutes=${CLEARDOWN_RETENTION_MINUTES:60}
travelduty.cleardown.interval-seconds=${CLEARDOWN_INTERVAL_SECONDS:60}
